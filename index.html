<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>머니 서바이벌</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0d0f14;--card:#161a22;--card2:#1f2431;--line:#2b3244;--text:#eef1f7;--muted:#9099ab;--gold:#f5c542;--gold2:#d99a12;--green:#3ddc84;--red:#ff5d6c;--blue:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg) radial-gradient(ellipse at top,#1b2234 0%,var(--bg) 65%) no-repeat;font-family:Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button,input{font:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:#4a5470}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1300;border:none}
.btn.big{display:block;width:100%;padding:16px;font-size:18px;margin-top:16px}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;margin-top:14px}
.btn.active{border-color:var(--gold);background:#2d2a1a;box-shadow:0 0 0 2px rgba(245,197,66,.25)}
input[type=text],input[type=number]{width:100%;background:#0f1218;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:16px}
input:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
/* landing */
.landing{max-width:440px;margin:6vh auto;padding:0 16px}
.landing h1{text-align:center;font-size:34px;margin:0 0 4px}
.landing .tag{text-align:center;color:var(--muted);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.landing .card+.card{margin-top:14px}
.landing h3{margin:0 0 4px}
/* shell */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1200px;margin:0 auto}
.brand{display:flex;gap:12px;align-items:center}
.logo{font-size:30px}
.title{font-size:20px;font-weight:800}
.sub{font-size:13px;color:var(--muted)}
.room{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.code-label{font-size:12px;color:var(--muted)}
.code{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--gold)}
.banner{max-width:1200px;margin:0 auto 8px;padding:10px 16px;background:#3a1d22;border:1px solid #6b2c36;border-radius:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:0 16px 24px;max-width:1200px;margin:0 auto;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stage h2{margin:0 0 6px}
.board h3{margin:0 0 10px}
/* board */
.row{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #222838;font-size:15px}
.row.me{background:rgba(245,197,66,.08);border-radius:8px}
.row.off{opacity:.45}
.rk{color:var(--muted);font-weight:700;text-align:center}
.row:nth-child(1) .rk{color:var(--gold)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.neg{color:var(--red)}
.dl{font-size:12px;font-weight:700;text-align:right;min-width:60px}
.up{color:var(--green)}.down{color:var(--red)}
.ok{color:var(--green);font-size:12px}
.kick{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 0 0 4px}
/* lobby */
.howto{background:var(--card2);border-radius:12px;padding:14px;margin:14px 0;line-height:1.6}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gchip{background:#12151c;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--muted);line-height:1.5}
.gchip b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 12px;margin-top:10px}
.sview{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{background:var(--card2);border-radius:999px;padding:6px 12px;font-size:13px}
.wait{margin-top:18px;padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* play */
.ghead{display:flex;gap:14px;align-items:flex-start}
.gicon{font-size:42px;line-height:1}
.gname{font-size:22px;font-weight:800}
.gdesc{color:var(--muted);line-height:1.55;margin-top:4px}
.timerbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0;padding:12px 14px;background:var(--card2);border-radius:12px}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.urgent{color:var(--red)}
.vs{padding:10px 14px;border-radius:10px;background:#1b2436;margin-bottom:12px}
.numgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.numgrid .btn{padding:10px 0}
@media(max-width:520px){.numgrid{grid-template-columns:repeat(5,1fr)}}
.pdgrid,.rpsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rpsgrid{grid-template-columns:repeat(3,1fr)}
.pdbtn{padding:26px 10px;font-size:20px}
.pdbtn small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
.horses{display:grid;gap:8px}
.done{padding:20px;text-align:center;font-size:18px;background:#16261d;border:1px solid #275a3a;border-radius:12px;line-height:1.7}
.picker{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.plabel{font-weight:700;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
/* result */
.announce{font-size:20px;text-align:center;padding:18px;margin:14px 0;background:linear-gradient(180deg,#2b2510,#1a1708);border:1px solid #5a4a14;border-radius:14px;line-height:1.6}
.announce big{font-size:34px;font-weight:800;color:var(--gold);display:block}
.list{display:grid;gap:6px;margin-top:10px}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--card2);border-radius:10px;font-size:15px}
.li.win{border:1px solid var(--gold)}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.numchip{padding:6px 10px;border-radius:10px;background:var(--card2);font-size:14px}
.numchip.uni{border:1px solid var(--green)}
.numchip.dup{opacity:.55;text-decoration:line-through}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px;background:var(--card2);border-radius:10px;margin-top:6px;font-size:15px}
.match .r{text-align:right}.match .c{text-align:center;font-size:13px;color:var(--muted)}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec{margin-top:18px;font-weight:700}
/* race */
.horses{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.horse-opt{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px}
.horse-opt img{width:64px;height:48px;object-fit:contain;flex:none}
.ho-t{display:flex;flex-direction:column;gap:2px;font-size:14px}
.ho-t .muted{font-size:12px;font-weight:500}
.odds{color:var(--gold)}
.live{display:flex;gap:8px;flex-wrap:wrap;min-height:40px;margin-top:12px;align-items:center;color:var(--muted)}
.lv{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:3px 12px 3px 6px;font-size:14px;font-weight:700;color:var(--text)}
.lv em{font-style:normal;color:var(--gold);font-size:12px}
.lv img{width:30px;height:24px;object-fit:contain}
.track{position:relative;margin-top:10px;border:2px solid #2c5a33;border-radius:12px;overflow:hidden;background:#2f6b37;padding-top:calc(var(--sz) - var(--lh) + 4px)}
.lane{display:grid;grid-template-columns:96px 1fr;align-items:center;height:var(--lh);position:relative}
.lane:nth-child(odd){background:rgba(255,255,255,.035)}
.lane+.lane{border-top:1px solid rgba(255,255,255,.12)}
.hn{font-size:12px;font-weight:700;padding:0 6px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.25);height:100%;display:flex;align-items:center;gap:6px;z-index:2}
.hn b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;background:var(--gold);color:#1a1300;font-size:11px}
.run{position:relative;height:100%;
  background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.10) 118px 122px);
  background-position-x:calc(var(--scroll,0px) * -1)}
.run::after{content:'';position:absolute;right:0;top:0;bottom:0;width:10px;
  background:repeating-linear-gradient(0deg,#fff 0 6px,#111 6px 12px);opacity:.9}
.runner{position:absolute;left:0;bottom:2px;width:var(--sz);height:var(--sz);z-index:1}
.runner img{width:100%;height:100%;object-fit:contain;transform-origin:50% 90%;
  animation:bob var(--sp) ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.track.ready .runner img,.runner.fin img,.track.over .runner img{animation-play-state:paused}
.runner.winner img{animation:cheer .6s ease-in-out infinite}
.runner.winner{z-index:3}
@keyframes bob{0%,100%{transform:translateY(0) rotate(2deg) scale(1.04,.94)}
  25%{transform:translateY(-22%) rotate(-5deg) scale(.97,1.04)}
  50%{transform:translateY(0) rotate(2deg) scale(1.04,.94)}
  75%{transform:translateY(-14%) rotate(-3deg) scale(.98,1.03)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-25%) scale(1.15)}}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:900;color:#fff;
  text-shadow:0 4px 16px rgba(0,0,0,.6);pointer-events:none;z-index:5}
.countdown:empty{display:none}
.photo{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#000b;color:var(--gold);font-weight:800;
  padding:6px 14px;border-radius:999px;z-index:5;opacity:0;transition:opacity .2s}
.photo.on{opacity:1}
.win-ann .win-img{display:block;width:150px;height:110px;object-fit:contain;margin:0 auto 6px;animation:cheer .8s ease-in-out infinite}
/* final */
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:end;margin:20px 0}
.pod{text-align:center;background:var(--card2);border-radius:12px 12px 0 0;padding:14px 6px}
.pod .medal{font-size:34px}.pod .pn{font-weight:800;margin-top:6px;word-break:break-all}.pod .pm{font-size:14px;margin-top:4px}
.pod.p1{min-height:190px;border:1px solid var(--gold);background:linear-gradient(180deg,#3a3110,var(--card2))}
.pod.p2{min-height:150px}.pod.p3{min-height:120px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.center{text-align:center;padding:40px 16px}
</style>
</head>

  for(let i=0;i+1<s.length;i+=2) pairs.push([s[i],s[i+1]]);
  if(s.length%2) pairs.push([s[s.length-1],'BOT']);
  return pairs;
}
function rollBox(){
  const r=Math.random();
  if(r<0.05) return -10000;
  if(r<0.15) return 0;
  if(r<0.75) return 5000+Math.floor(Math.random()*16)*1000;
  return 20000+Math.floor(Math.random()*31)*1000;
}
// 라운드마다 n마리를 랜덤으로 뽑고 우승 확률·배당을 정함 (배당 = 0.88 / 확률)
function makeRunners(n){
  n=Math.max(2,Math.min(AVATAR_NAMES.length,Math.floor(n)||6));
  const ids=shuffle(AVATAR_NAMES.map((_,i)=>i)).slice(0,n);
  const w=ids.map(()=>0.15+Math.pow(Math.random(),1.6)), sum=w.reduce((a,b)=>a+b,0);
  return ids.map((av,i)=>{ const p=w[i]/sum; return { av, name:AVATAR_NAMES[av], p, odds:Math.max(1.1,Math.round(8.8/p)/10) }; });
}
function pickRunner(R){ let r=Math.random(); for(let i=0;i<R.length;i++){ r-=R[i].p; if(r<0) return i; } return R.length-1; }
// 같은 seed면 모든 화면에서 똑같은 경주 장면이 나옴
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function raceScript(order,seed,T){
  T=T||9; const rnd=mulberry32(seed), K=7, plans=new Array(order.length); let f=T;
  order.forEach((ri,rank)=>{
    if(rank>0) f+=0.15+rnd()*0.35;
    const pts=[0];
    for(let k=1;k<K;k++){ const base=k/K, amp=0.14*Math.sin(Math.PI*base); let v=base+(rnd()*2-1)*amp; v=Math.max(v,pts[k-1]+0.03); pts.push(Math.min(v,0.97)); }
    pts.push(1); plans[ri]={ f, pts };
  });
  return plans;
}
function raceX(plan,t){ if(t<=0) return 0; if(t>=plan.f) return 1; const K=plan.pts.length-1, u=t/plan.f*K, k=Math.floor(u), fr=u-k; return plan.pts[k]+(plan.pts[k+1]-plan.pts[k])*fr; }
function randHand(){ return ['R','P','S'][Math.floor(Math.random()*3)]; }
function toAmt(v){ if(v===''||v===null||v===undefined) return null; const n=Math.floor(Number(v)); return Number.isFinite(n)&&n>=0&&n<=1e15?n:null; }

function validate(type,d,params){
  if(!d||typeof d!=='object') return null;
  const RN=(params&&params.runners)?params.runners.length:0;
  switch(type){
    case 'unique': { const n=Math.floor(Number(d.n)); return n>=1&&n<=50?{n}:null; }
    case 'auction': { const b=toAmt(d.bid); return b===null?null:{bid:b}; }
    case 'pd': return (d.c==='C'||d.c==='B')?{c:d.c}:null;
    case 'race': { const h=Math.floor(Number(d.h)), a=toAmt(d.a); return (h>=0&&h<RN&&a!==null&&a>0)?{h,a}:null; }
    case 'duel': { const a=toAmt(d.a); return (HANDS[d.r]&&a!==null)?{r:d.r,a}:null; }
  }
  return null;
}

function resolve(type,params,subs){
  const deltas={};
  const add=(id,v)=>{ if(id==='BOT'||!v) return; deltas[id]=(deltas[id]||0)+v; };
  if(type==='unique'){
    const fee=params.fee;
    const picks=Object.entries(subs).map(([id,s])=>({id,n:s.n}));
    const cnt={}; picks.forEach(p=>cnt[p.n]=(cnt[p.n]||0)+1);
    const uniq=Object.keys(cnt).map(Number).filter(n=>cnt[n]===1).sort((a,b)=>a-b);
    const pot=fee*picks.length; let winner=null, winNum=null;
    if(uniq.length){ winNum=uniq[0]; winner=picks.find(p=>p.n===winNum).id; picks.forEach(p=>add(p.id,-fee)); add(winner,pot); }
    picks.sort((a,b)=>a.n-b.n);
    return { deltas, detail:{ picks, winner, winNum, pot, fee } };
  }
  if(type==='auction'){
    const box=rollBox();
    const bids=Object.entries(subs).map(([id,s])=>({id,bid:s.bid,ts:s.ts||0})).sort((a,b)=>b.bid-a.bid||a.ts-b.ts);
    let winner=null;
    if(bids.length&&bids[0].bid>0){ winner=bids[0].id; add(winner,box-bids[0].bid); }
    return { deltas, detail:{ box, winner, bids:bids.map(b=>({id:b.id,bid:b.bid})) } };
  }
  if(type==='pd'){
    const S=params.stake;
    const rows=params.pairs.map(([a,b])=>{
      const ca=a==='BOT'?(Math.random()<0.5?'C':'B'):(subs[a]?subs[a].c:'C');
      const cb=b==='BOT'?(Math.random()<0.5?'C':'B'):(subs[b]?subs[b].c:'C');
      let da,db;
      if(ca==='C'&&cb==='C'){ da=S; db=S; }
      else if(ca==='B'&&cb==='B'){ da=-S; db=-S; }
      else if(ca==='B'){ da=2*S; db=-2*S; }
      else { da=-2*S; db=2*S; }
      add(a,da); add(b,db);
      return { a,b,ca,cb,da,db, ma:a!=='BOT'&&!subs[a], mb:b!=='BOT'&&!subs[b] };
    });
    return { deltas, detail:{ rows, stake:S } };
  }
  if(type==='race'){
    const R=params.runners, w=pickRunner(R);
    const order=[w,...shuffle(R.map((_,i)=>i).filter(i=>i!==w))];
    const bets=Object.entries(subs).map(([id,s])=>{
      const d=s.h===w?Math.floor(s.a*R[w].odds)-s.a:-s.a;
      add(id,d); return { id,h:s.h,a:s.a,d };
    }).sort((x,y)=>y.d-x.d);
    return { deltas, detail:{ winner:w, order, bets, runners:R, seed:Math.floor(Math.random()*2147483647) } };
  }
  if(type==='duel'){
    const rows=params.pairs.map(([a,b])=>{
      const sa=a==='BOT'?{r:randHand(),a:0}:(subs[a]||{r:randHand(),a:0,miss:true});
      const sb=b==='BOT'?{r:randHand(),a:0}:(subs[b]||{r:randHand(),a:0,miss:true});
      const stake=Math.max(sa.a,sb.a);
      let da=0,db=0;
      if(sa.r!==sb.r){ if(BEATS[sa.r]===sb.r){ da=stake; db=-stake; } else { da=-stake; db=stake; } }
      add(a,da); add(b,db);
      return { a,b,ra:sa.r,rb:sb.r,aa:sa.a,ab:sb.a,stake,da,db,ma:!!sa.miss,mb:!!sb.miss };
    });
    return { deltas, detail:{ rows } };
  }
  return { deltas, detail:{} };
}

// 컴퓨터(봇)의 선택
const BOT_NAMES=['🤖 알파','🤖 베타','🤖 감마','🤖 델타','🤖 오메가','🤖 타짜','🤖 쫄보','🤖 올인','🤖 계산기'];
function botAmount(money,lo,hi,step){ const base=Math.max(money,3000); return Math.max(step,Math.round(base*(lo+Math.random()*(hi-lo))/step)*step); }
function botMove(type,money,params){
  switch(type){
    case 'unique': return { n:1+Math.floor(Math.pow(Math.random(),2)*15) };
    case 'auction': return { bid: Math.random()<0.2?0:Math.round((2000+Math.random()*28000)/1000)*1000 };
    case 'pd': return { c: Math.random()<0.55?'C':'B' };
    case 'race': { const R=params.runners; return { h: Math.random()<0.25?Math.floor(Math.random()*R.length):pickRunner(R), a: botAmount(money,0.1,0.4,100) }; }
    case 'duel': return { r: randHand(), a: Math.random()<0.15?0:botAmount(money,0.05,0.35,100) };
  }
  return null;
}
// ===== LOGIC END =====

const PREFIX='msurv-v1-';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ko-KR');
const signed=n=>(n>0?'+':'')+fmt(n);
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const store={ get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function baseUrl(){ return location.href.split('?')[0].split('#')[0]; }
function genCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

let S=null;                 // 공개 게임 상태 (모두 동일)
let ME={pid:null,isHost:false,code:null,name:''};
let HOST=null;              // 방장 전용: {state, subs, conns, peer, banned}
let CL=null;                // 참가자 전용: {peer, conn}
let clockOffset=0, mySub={round:-1,data:null}, lastKey='', SEL={}, kicked=false, RACING=false;

/* ================= 방장(호스트) ================= */
function newState(code,title,hostPid,hostName){
  return { code, title, hostId:hostPid, phase:'lobby', round:0,
    settings:{ startMoney:10000, rounds:5, timer:40, fee:1000, pdStake:2000, horses:6 },
    players:{ [hostPid]:{ name:hostName, money:10000, online:true, last:0 } },
    game:null, result:null };
}
let bcTimer=null;
function changed(){
  const st=HOST.state;
  if(!st.single) store.set('msurv-host',{ code:st.code, state:st, subs:HOST.subs, banned:[...HOST.banned], t:Date.now() });
  S=JSON.parse(JSON.stringify(st)); clockOffset=0;
  if(S.phase==='lobby') mySub={round:-1,data:null};
  render();
  if(!bcTimer) bcTimer=setTimeout(()=>{ bcTimer=null; const msg={t:'state',s:HOST.state,now:Date.now()}; for(const c of HOST.conns.keys()) if(c.open) try{ c.send(msg); }catch(e){} },80);
}
function cleanName(n){ n=String(n||'').trim().slice(0,12); return n||'익명'; }
function uniqueName(name,pid){
  const taken=new Set(Object.entries(HOST.state.players).filter(([id])=>id!==pid).map(([,p])=>p.name));
  if(!taken.has(name)) return name;
  for(let i=2;;i++) if(!taken.has(name+i)) return name+i;
}
function onHostData(conn,d){
  const st=HOST.state;
  if(!d||typeof d!=='object') return;
  if(d.t==='join'){
    const pid=typeof d.pid==='string'&&d.pid.length<40?d.pid:rid();
    if(HOST.banned.has(pid)){ try{ conn.send({t:'kicked'}); }catch(e){} setTimeout(()=>conn.close(),300); return; }
    for(const [c,p] of HOST.conns) if(p===pid&&c!==conn) HOST.conns.delete(c);
    HOST.conns.set(conn,pid);
    if(st.players[pid]) st.players[pid].online=true;
    else st.players[pid]={ name:uniqueName(cleanName(d.name),pid), money:st.settings.startMoney, online:true, last:0 };
    try{ conn.send({t:'welcome',pid}); }catch(e){}
    changed(); return;
  }
  if(d.t==='act'){
    const pid=HOST.conns.get(conn);
    if(pid&&d.round===st.round) hSubmit(pid,d.data);
  }
}
function onConnClose(conn){
  const pid=HOST.conns.get(conn); HOST.conns.delete(conn);
  if(!pid||!HOST.state.players[pid]) return;
  if([...HOST.conns.values()].includes(pid)) return;
  HOST.state.players[pid].online=false; changed(); checkAllIn();
}
function hSettings(k,v){
  const st=HOST.state; if(st.phase!=='lobby') return;
  if(k==='title'){ st.title=String(v).trim().slice(0,30)||'머니 서바이벌'; return changed(); }
  if(k==='bots'){ setBots(Math.min(9,Math.max(1,Math.floor(Number(v))||1))); return changed(); }
  const lim={ startMoney:[0,1e12], rounds:[1,30], timer:[10,300], fee:[0,1e12], pdStake:[0,1e12], horses:[2,AVATAR_NAMES.length] }[k];
  if(!lim) return;
  let n=Math.floor(Number(v)); if(!Number.isFinite(n)) return changed();
  n=Math.min(lim[1],Math.max(lim[0],n)); st.settings[k]=n; changed();
}
function resetMoney(){ const st=HOST.state; for(const p of Object.values(st.players)){ p.money=st.settings.startMoney; p.last=0; } }
function hStartGame(){ const st=HOST.state; resetMoney(); st.round=0; st.result=null; st.game=null; st.phase='pick'; changed(); }
function hStartRound(type){
  const st=HOST.state; if(st.phase!=='pick'&&st.phase!=='result') return;
  if(type==='random'){ const ks=Object.keys(GAMES); type=ks[Math.floor(Math.random()*ks.length)]; }
  const online=Object.keys(st.players).filter(id=>st.players[id].online);
  const params={};
  if(type==='unique') params.fee=st.settings.fee;
  if(type==='pd'){ params.stake=st.settings.pdStake; params.pairs=makePairs(online); }
  if(type==='duel') params.pairs=makePairs(online);
  if(type==='race') params.runners=makeRunners(st.settings.horses||6);
  st.round+=1;
  st.game={ type, params, eligible:online, submitted:{}, deadline:Date.now()+st.settings.timer*1000 };
  st.result=null; HOST.subs={}; st.phase='play'; changed();
  scheduleBots();
}
/* ---- 컴퓨터(봇) ---- */
function setBots(n){
  const st=HOST.state;
  const bots=Object.keys(st.players).filter(id=>st.players[id].bot);
  while(bots.length>n){ delete st.players[bots.pop()]; }
  for(let i=0;bots.length<n&&i<BOT_NAMES.length;i++){
    const id='bot'+i; if(st.players[id]) continue;
    st.players[id]={ name:BOT_NAMES[i], money:st.settings.startMoney, online:true, last:0, bot:true }; bots.push(id);
  }
}
function scheduleBots(){
  const st=HOST.state, g=st.game, round=st.round;
  const maxWait=Math.min(st.settings.timer*600,12000);
  g.eligible.filter(id=>st.players[id]&&st.players[id].bot).forEach(id=>{
    setTimeout(()=>{
      if(HOST.state.round!==round||HOST.state.phase!=='play'||!st.players[id]) return;
      hSubmit(id,botMove(g.type,st.players[id].money,g.params));
    },1500+Math.random()*Math.max(0,maxWait-1500));
  });
}
function createSingle(name,botCount){
  ME.isHost=true; ME.name=name;
  const pid=rid(), state=newState('싱글','머니 서바이벌 · 싱글',pid,name);
  state.single=true;
  HOST={ state, subs:{}, conns:new Map(), banned:new Set(), single:true };
  setBots(botCount);
  ME.pid=pid; ME.code=state.code;
  changed();
}
function hSubmit(pid,data){
  const st=HOST.state; if(st.phase!=='play') return;
  const g=st.game; if(!g.eligible.includes(pid)||g.submitted[pid]) return;
  const clean=validate(g.type,data,g.params); if(!clean) return;
  HOST.subs[pid]={...clean,ts:Date.now()}; g.submitted[pid]=true; changed(); checkAllIn();
}
function checkAllIn(){
  const st=HOST.state; if(st.phase!=='play') return;
  const g=st.game, need=g.eligible.filter(id=>st.players[id]&&st.players[id].online);
  if(need.length&&need.every(id=>g.submitted[id])){ const r=st.round; setTimeout(()=>{ if(HOST.state.round===r) hClose(); },900); }
}
function hClose(){
  const st=HOST.state; if(st.phase!=='play') return;
  const g=st.game, res=resolve(g.type,g.params,HOST.subs);
  for(const p of Object.values(st.players)) p.last=0;
  for(const [id,d] of Object.entries(res.deltas)) if(st.players[id]){ st.players[id].money+=d; st.players[id].last=d; }
  st.result={ type:g.type, round:st.round, detail:res.detail, deltas:res.deltas };
  st.game=null; st.phase='result'; changed();
}
function hFinal(){ HOST.state.phase='final'; changed(); }
function hReset(){ const st=HOST.state; resetMoney(); st.round=0; st.game=null; st.result=null; st.phase='lobby'; changed(); }
function hKick(pid){
  const st=HOST.state; if(pid===st.hostId||!st.players[pid]) return;
  if(!confirm(`${st.players[pid].name} 님을 내보낼까요? 이 방에 다시 들어올 수 없어요.`)) return;
  HOST.banned.add(pid); delete st.players[pid];
  for(const [c,p] of HOST.conns) if(p===pid){ try{ c.send({t:'kicked'}); }catch(e){} setTimeout(()=>c.close(),300); }
  changed(); checkAllIn();
}
function createRoom(name,title,resume){
  if(typeof Peer==='undefined') return toast(NO_PEER_MSG);
  ME.isHost=true; ME.name=name;
  if(resume){
    HOST={ state:resume.state, subs:resume.subs||{}, conns:new Map(), banned:new Set(resume.banned||[]) };
    for(const [id,p] of Object.entries(HOST.state.players)) p.online=id===HOST.state.hostId;
  } else {
    const pid=rid();
    HOST={ state:newState(genCode(),title||'머니 서바이벌',pid,name), subs:{}, conns:new Map(), banned:new Set() };
  }
  ME.pid=HOST.state.hostId; ME.code=HOST.state.code;
  showCenter('방을 여는 중…');
  hostOpen(0,!!resume);
}
function hostOpen(attempt,resuming){
  const peer=new Peer(PREFIX+HOST.state.code); HOST.peer=peer;
  peer.on('open',()=>{ ME.code=HOST.state.code; changed(); });
  peer.on('connection',conn=>{ conn.on('data',d=>onHostData(conn,d)); conn.on('close',()=>onConnClose(conn)); conn.on('error',()=>onConnClose(conn)); });
  peer.on('disconnected',()=>{ if(!peer.destroyed) setTimeout(()=>peer.reconnect(),1000); });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      peer.destroy();
      if(resuming&&attempt<10){ showCenter(`이전 방을 다시 여는 중… (${attempt+1})`); setTimeout(()=>hostOpen(attempt+1,true),3000); }
      else { HOST.state.code=genCode(); hostOpen(0,false); }
    } else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){ toast('연결 서버와 통신이 불안정해요. 잠시 후 자동으로 다시 시도합니다.'); }
  });
}

/* ================= 참가자(시청자) ================= */
function joinRoom(code,name){
  if(typeof Peer==='undefined') return toast(NO_PEER_MSG);
  code=String(code).trim().toUpperCase(); ME={ pid:store.get('msurv-pid-'+code)||rid(), isHost:false, code, name };
  store.set('msurv-pid-'+code,ME.pid); store.set('msurv-name',name);
  history.replaceState(null,'',baseUrl()+'?room='+code);
  if(!S) showCenter('방에 접속하는 중…');
  if(CL&&CL.peer) try{ CL.peer.destroy(); }catch(e){}
  const peer=new Peer(); CL={peer,conn:null};
  const fail=setTimeout(()=>{ if(!S) showCenter('방에 연결하지 못했어요.<br><span class="muted">코드가 맞는지, 스트리머가 방을 열어 두었는지 확인해 주세요.</span><br><br><button class="btn" onclick="location.reload()">다시 시도</button>'); },15000);
  peer.on('open',()=>{
    const conn=peer.connect(PREFIX+code,{reliable:true}); CL.conn=conn;
    conn.on('open',()=>{ conn.send({t:'join',pid:ME.pid,name}); setBanner(null); });
    conn.on('data',d=>{ clearTimeout(fail); onClientData(d); });
    conn.on('close',onClientClose);
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){ clearTimeout(fail); if(S) setBanner('방장과 연결이 끊겼어요.'); else showCenter('방을 찾을 수 없어요.<br><span class="muted">코드를 확인하거나, 스트리머가 방을 열어 두었는지 확인해 주세요.</span><br><br><button class="btn" onclick="location.reload()">다시 시도</button>'); }
  });
}
function onClientData(d){
  if(d.t==='state'){ clockOffset=Date.now()-d.now; S=d.s; if(S.phase==='lobby') mySub={round:-1,data:null}; render(); }
  else if(d.t==='welcome'){ ME.pid=d.pid; }
  else if(d.t==='kicked'){ kicked=true; S=null; showCenter('방장이 이 방에서 내보냈어요.'); }
}
function onClientClose(){ if(kicked) return; setBanner('방장과 연결이 끊겼어요.'); }
function setBanner(msg){
  const b=$('#banner'); if(!b) return;
  if(!msg){ b.classList.add('hidden'); return; }
  b.innerHTML=`<span>${esc(msg)}</span><button class="btn sm" id="rejoin">다시 접속</button>`; b.classList.remove('hidden');
  $('#rejoin').onclick=()=>joinRoom(ME.code,ME.name);
}

/* ================= 화면 ================= */
function showCenter(html){ lastKey=''; $('#app').innerHTML=`<div class="landing"><div class="card center">${html}</div></div>`; }
function landing(){
  const params=new URLSearchParams(location.search), room=params.get('room');
  const savedName=esc(store.get('msurv-name')||'');
  const saved=store.get('msurv-host');
  const canResume=saved&&saved.state&&Date.now()-saved.t<12*3600*1000;
  let html=`<div class="landing"><h1>💰 머니 서바이벌</h1><div class="tag">미니게임으로 돈을 불려라, 마지막에 가장 부자인 사람이 우승!</div>`;
  if(room){

function tick(){
  if(!S||S.phase!=='play') return; const el=$('#timer'); if(!el) return;

function myOpponent(g){

const amtInput=(ph)=>`<label>금액 (상한 없음 · 보유금보다 많이 걸면 마이너스가 될 수 있어요)</label><input type="number" id="amt" min="0" inputmode="numeric" placeholder="${ph}">`;

const HINT={ unique:'숫자를 하나 골라주세요', auction:'입찰 금액을 입력하세요 (0 이상)', race:'말을 고르고 1원 이상 걸어주세요', duel:'가위·바위·보를 고르고 금액을 입력하세요' };
function bindStage(){
  const st=$('#stage');
  st.onclick=e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.id==='startBtn') return hStartGame();
    if(t.id==='closeBtn') return hClose();
    if(t.id==='finalBtn') return hFinal();
    if(t.id==='resetBtn') return hReset();
    if(t.dataset.game) return hStartRound(t.dataset.game);
    if(t.dataset.grp){ st.querySelectorAll(`[data-grp="${t.dataset.grp}"]`).forEach(b=>b.classList.toggle('active',b===t)); SEL[t.dataset.grp]=t.dataset.sel; return; }
    if(t.dataset.pd) return submit({c:t.dataset.pd});
    if(t.id==='submitBtn') return submitForm();
  };
  st.onchange=e=>{ if(e.target.dataset.set&&ME.isHost) hSettings(e.target.dataset.set,e.target.value); };
  const amt=$('#amt'); if(amt) amt.onkeydown=e=>{ if(e.key==='Enter') submitForm(); };

function submitForm(){
  const g=S.game, a=$('#amt')?$('#amt').value:'';
  const d={ unique:{n:SEL.n}, auction:{bid:a}, race:{h:SEL.h,a}, duel:{r:SEL.r,a} }[g.type];

}
function submit(d){
  if(!S||S.phase!=='play') return;
  const g=S.game, clean=validate(g.type,d,g.params);
  if(!clean) return toast(HINT[g.type]||'입력을 확인해 주세요');
  mySub={round:S.round,data:clean};
  if(ME.isHost) hSubmit(ME.pid,clean);
  else { if(CL&&CL.conn&&CL.conn.open) CL.conn.send({t:'act',round:S.round,data:clean}); else { mySub={round:-1,data:null}; return toast('연결이 끊겨 제출하지 못했어요'); } render(); }
}

function resultHTML(){

function resultBody(r){
  const d=r.detail;
  if(r.type==='unique'){
    if(!d.picks.length) return `<div class="announce">아무도 참여하지 않았어요.</div>`;
    const by={}; d.picks.forEach(p=>(by[p.n]=by[p.n]||[]).push(p.id));
    const chips=Object.keys(by).map(Number).sort((a,b)=>a-b).map(n=>`<span class="numchip ${by[n].length===1?'uni':'dup'}"><b>${n}</b> · ${by[n].map(nameOf).join(', ')}</span>`).join('');
    const head=d.winner?`<div class="announce">가장 작은 유일 숫자는<big>${d.winNum}</big><b>${nameOf(d.winner)}</b> 님이 판돈 <b>${fmt(d.pot)}원</b> 획득!</div>`:`<div class="announce">겹치지 않은 숫자가 하나도 없어요!<br>참가비는 모두 돌려드렸어요.</div>`;
    return head+`<div class="sec">모두의 선택 (초록 = 유일, 줄 = 겹침)</div><div class="nums">${chips}</div>`;
  }
  if(r.type==='auction'){
    const w=d.bids[0];
    const head=d.winner?`<div class="announce">상자 안의 금액은…<big>${fmt(d.box)}원</big><b>${nameOf(d.winner)}</b> 님이 ${fmt(w.bid)}원에 낙찰 → <b class="${d.box-w.bid>=0?'up':'down'}">${signed(d.box-w.bid)}</b></div>`:`<div class="announce">입찰자가 없었어요. 상자 안에는<big>${fmt(d.box)}원</big></div>`;
    return head+(d.bids.length?`<div class="sec">입찰 내역</div><div class="list">${d.bids.map((b,i)=>`<div class="li ${i===0&&d.winner?'win':''}"><span>${nameOf(b.id)}</span><b>${fmt(b.bid)}원</b></div>`).join('')}</div>`:'');
  }
  if(r.type==='pd'){
    const lab=(c,m)=>(c==='C'?'🤝 협력':'🗡️ 배신')+(m?' <span class="muted">(미제출)</span>':'');
    return `<div class="sec">짝별 결과</div>`+d.rows.map(x=>`<div class="match"><div>${nameOf(x.a)}<br>${lab(x.ca,x.ma)} <b class="${x.da>0?'up':'down'}">${signed(x.da)}</b></div><div class="c">VS</div><div class="r">${nameOf(x.b)}<br><b class="${x.db>0?'up':'down'}">${signed(x.db)}</b> ${lab(x.cb,x.mb)}</div></div>`).join('');
  }
  if(r.type==='race'){
    const R=d.runners, n=R.length, lh=n<=6?58:n<=10?46:n<=14?38:30;
    return `<div class="live" id="live"></div>
      <div class="track ready" id="track" style="--lh:${lh}px;--sz:${Math.round(lh*1.35)}px">
        <div class="countdown" id="countdown"></div><div class="photo" id="photo">📸 결승 직전!</div>
        ${R.map((h,i)=>`<div class="lane"><span class="hn"><b>${i+1}</b> ${esc(h.name)}</span><div class="run"><div class="runner" data-i="${i}" style="--d:${(-Math.random()*0.4).toFixed(2)}s;--sp:${(0.32+Math.random()*0.08).toFixed(2)}s"><img src="${AVATAR_SRC[h.av]}" alt=""></div></div></div>`).join('')}
      </div><button class="btn sm ghost" id="skipRace">결과 바로 보기 ⏭</button>`;
  }
  if(r.type==='duel'){
    const side=(h,a,m)=>`${HANDS[h]} · ${fmt(a)}원${m?' <span class="muted">(미제출)</span>':''}`;
    return `<div class="sec">대결 결과</div>`+d.rows.map(x=>`<div class="match"><div>${nameOf(x.a)}<br>${side(x.ra,x.aa,x.ma)}<br><b class="${x.da>0?'up':x.da<0?'down':''}">${x.da?signed(x.da):'무승부'}</b></div><div class="c">판돈<br>${fmt(x.stake)}</div><div class="r">${nameOf(x.b)}<br>${side(x.rb,x.ab,x.mb)}<br><b class="${x.db>0?'up':x.db<0?'down':''}">${x.db?signed(x.db):'무승부'}</b></div></div>`).join('');
  }
  return '';
}
function raceReveal(d){
  const R=d.runners, h=R[d.winner];
  const podium=d.order.slice(0,3).map((ri,k)=>`<span class="pill">${['🥇','🥈','🥉'][k]} ${ri+1}번 ${esc(R[ri].name)}</span>`).join(' ');
  return `<div class="announce win-ann"><img class="win-img" src="${AVATAR_SRC[h.av]}" alt="">우승은<big>${d.winner+1}번 ${esc(h.name)}!</big>배당 ${h.odds}배<div class="deltas" style="justify-content:center">${podium}</div></div>`+
    (d.bets.length?`<div class="sec">베팅 내역</div><div class="list">${d.bets.map(b=>`<div class="li ${b.h===d.winner?'win':''}"><span>${nameOf(b.id)} · ${b.h+1}번 ${esc(R[b.h].name)} ${fmt(b.a)}원</span><b class="${b.d>0?'up':'down'}">${signed(b.d)}</b></div>`).join('')}</div>`:'<p class="muted">아무도 베팅하지 않았어요.</p>');
}
function afterStage(){
  if(S.phase==='result'&&S.result.type==='race') runRace();
}
function runRace(){
  const d=S.result.detail, R=d.runners, plans=raceScript(d.order,d.seed), key=lastKey;
  const track=$('#track'), live=$('#live'), cd=$('#countdown'), photo=$('#photo');
  const els=[...track.querySelectorAll('.runner')];
  const endT=plans[d.order[d.order.length-1]].f+0.4, winT=plans[d.winner].f;
  let sim=-2.4, last=performance.now(), liveTxt='', done=false;
  RACING=true;
  const finish=()=>{ if(done) return; done=true; RACING=false; if(lastKey===key) updateDynamic();
    els.forEach((el,i)=>{ el.style.left=`calc(100% - var(--sz))`; el.classList.toggle('winner',i===d.winner); });
    track.classList.add('over'); photo.classList.remove('on'); cd.textContent='';
    const r=$('#reveal'); if(r) r.classList.remove('hidden'); const sk=$('#skipRace'); if(sk) sk.remove(); };
  $('#skipRace').onclick=finish;
  function frame(now){
    if(done||lastKey!==key||!document.body.contains(track)) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    const t=Math.max(0,sim), xs=plans.map(p=>raceX(p,t)), lead=Math.max(...xs);
    const slow=sim>0&&lead>0.86&&t<winT;
    sim+=dt*(slow?0.35:1);
    if(sim<0){ cd.textContent=sim<-1.6?'3':sim<-0.8?'2':'1'; }
    else if(sim<0.6){ cd.textContent='GO!'; track.classList.remove('ready'); }
    else cd.textContent='';
    photo.classList.toggle('on',slow);
    track.style.setProperty('--scroll',(t*260).toFixed(0)+'px');
    els.forEach((el,i)=>{ el.style.left=`calc(${xs[i].toFixed(4)} * (100% - var(--sz)))`; el.classList.toggle('fin',xs[i]>=1); });
    const rank=xs.map((x,i)=>[x,plans[i].f,i]).sort((a,b)=>(b[0]-a[0])||(a[1]-b[1])).slice(0,3);
    const txt=sim<0?'출발 대기 중…':rank.map(([,,i],k)=>`<span class="lv"><em>${k+1}위</em><img src="${AVATAR_SRC[R[i].av]}" alt="">${i+1}번 ${esc(R[i].name)}</span>`).join('');
    if(txt!==liveTxt){ live.innerHTML=txt; liveTxt=txt; }
    if(sim>=endT) finish(); else requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function finalHTML(){
  const ids=Object.keys(S.players).sort((a,b)=>S.players[b].money-S.players[a].money);
  const pod=(i,cls,medal)=>ids[i]?`<div class="pod ${cls}"><div class="medal">${medal}</div><div class="pn">${nameOf(ids[i])}</div><div class="pm ${S.players[ids[i]].money<0?'neg':''}">${fmt(S.players[ids[i]].money)}원</div></div>`:'<div></div>';
  return `<h2>🏆 최종 결과</h2>
    ${ids[0]?`<div class="announce">우승<big>${nameOf(ids[0])}</big>${fmt(S.players[ids[0]].money)}원</div>`:''}
    <div class="podium">${pod(1,'p2','🥈')}${pod(0,'p1','🥇')}${pod(2,'p3','🥉')}</div>
    <div class="list">${ids.map((id,i)=>`<div class="li ${id===ME.pid?'win':''}"><span>${i+1}위 · ${nameOf(id)}</span><b class="${S.players[id].money<0?'neg':''}">${fmt(S.players[id].money)}원</b></div>`).join('')}</div>
    ${ME.isHost?`<button class="btn big gold" id="resetBtn">🔁 ${S.single?'다시 하기':'같은 멤버로 새 게임'}</button>`:''}`;
}

const NO_PEER_MSG='멀티 모드 연결 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요. (싱글 모드는 그대로 쓸 수 있어요)';
landing();
</script>
